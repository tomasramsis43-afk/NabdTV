name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (preinstalled on runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Use private signing key if the KEYSTORE_B64 secret exists
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/nabd-release.jks; fi
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            ERR=$(grep -E "^e: |What went wrong|error:" -A3 build.log | head -40)
            ERR="${ERR//$'\n'/%0A}"
            echo "::error::$ERR"
          fi
          exit $rc
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NabdTV-debug.apk
          gh release create "v2.0.${{ github.run_number }}" NabdTV-debug.apk --title "NabdTV v2.0.${{ github.run_number }}" --notes "Debug APK"
